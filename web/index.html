<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>任务管理器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titlebar pywebview-drag-region" id="titlebar">
    <div class="tb-brand">
      <svg class="tb-logo" viewBox="0 0 16 16" aria-hidden="true">
        <rect x="1.5" y="3" width="13" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.1"/>
        <path d="M1.5 6.2h13" stroke="currentColor" stroke-width="1.1"/>
        <path d="M6.6 6.2V13" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      <span class="tb-title">任务管理器</span>
    </div>
    <div class="tb-actions">
      <button class="tb-btn" id="btn-pin" title="窗口置顶">
        <svg viewBox="0 0 16 16"><path d="M6 1.8h4M8 3.2v4.2M8 7.4 5.2 9.6v1.2h5.6V9.6L8 7.4M8 10.8v3.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-btn" id="btn-min" title="最小化">
        <svg viewBox="0 0 16 16"><path d="M3.5 8h9" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      </button>
      <button class="tb-btn" id="btn-max" title="最大化">
        <svg viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
      </button>
      <button class="tb-btn tb-close" id="btn-close" title="关闭">
        <svg viewBox="0 0 16 16"><path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <nav class="rail" id="rail">
      <button class="rail-menu" id="rail-menu" title="导航菜单">
        <svg viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
      </button>
      <ul class="rail-list">
        <li><button class="rail-item" data-page="processes">
          <svg viewBox="0 0 16 16"><rect x="2.2" y="2.2" width="5" height="5" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="8.8" y="2.2" width="5" height="5" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="2.2" y="8.8" width="5" height="5" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="8.8" y="8.8" width="5" height="5" rx="1.1" fill="none" stroke="currentColor" stroke-width="1.1"/></svg>
          <span>进程</span>
        </button></li>
        <li><button class="rail-item active" data-page="performance">
          <svg viewBox="0 0 16 16"><path d="M1.8 11.6 5.2 7.2l2.9 2.4L14.2 3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><path d="M10.8 3.4h3.4v3.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>性能</span>
        </button></li>
        <li><button class="rail-item" data-page="history">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M8 4.6V8l2.4 1.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          <span>应用历史记录</span>
        </button></li>
        <li><button class="rail-item" data-page="startup">
          <svg viewBox="0 0 16 16"><path d="M9.2 1.6 4.1 9h3.4l-.7 5.4L12.1 7H8.6z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          <span>启动应用</span>
        </button></li>
        <li><button class="rail-item" data-page="users">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="5.2" r="2.7" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M2.8 13.6c0-2.9 2.4-4.4 5.2-4.4s5.2 1.5 5.2 4.4" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          <span>用户</span>
        </button></li>
        <li><button class="rail-item" data-page="details">
          <svg viewBox="0 0 16 16"><path d="M2.4 4.2h11.2M2.4 8h11.2M2.4 11.8h7.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          <span>详细信息</span>
        </button></li>
        <li><button class="rail-item" data-page="services">
          <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.1"/><path d="M8 1.6v1.9M8 12.5v1.9M1.6 8h1.9M12.5 8h1.9M3.5 3.5l1.3 1.3M11.2 11.2l1.3 1.3M12.5 3.5l-1.3 1.3M4.8 11.2l-1.3 1.3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/></svg>
          <span>服务</span>
        </button></li>
      </ul>
    </nav>

    <section class="main">
      <div class="toolbar">
        <h2 class="page-title" id="page-title">性能</h2>
        <div class="toolbar-right">
          <button class="ghost-btn" id="btn-newtask">
            <svg viewBox="0 0 16 16"><path d="M8 3.4v9.2M3.4 8h9.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            运行新任务
          </button>
          <button class="ghost-btn icon-only" id="btn-more" title="更多">
            <svg viewBox="0 0 16 16"><circle cx="3.4" cy="8" r="1.1" fill="currentColor"/><circle cx="8" cy="8" r="1.1" fill="currentColor"/><circle cx="12.6" cy="8" r="1.1" fill="currentColor"/></svg>
          </button>
        </div>
      </div>

      <div class="panes">
        <div class="tiles" id="tiles"></div>
        <div class="detail" id="detail"></div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
